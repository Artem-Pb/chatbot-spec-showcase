services:
  postgres:
    image: postgres:15-alpine
    container_name: table_bot_showcase_db
    environment:
      POSTGRES_DB: ${DB_NAME:-tablebot}
      POSTGRES_USER: ${DB_USER:-tablebot}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-tablebot_pass}
    ports:
      - "5433:5432"
    volumes:
      - tablebot_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tablebot -d tablebot"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  tablebot_data:
